name: Build Go CLI

permissions:
  contents: write

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:

jobs:
  coverage:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      MIN_COVERAGE: "90.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Download deps
        working-directory: .
        run: go mod download

      - name: Run tests with coverage
        working-directory: .
        run: go test -coverprofile=cover.out ./...

      - name: Enforce minimum coverage
        working-directory: .
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v total="$total" -v min="$MIN_COVERAGE" 'BEGIN {
            if ((total + 0) < (min + 0)) {
              printf("Coverage %.1f%% is below required %.1f%%\n", total, min);
              exit 1;
            }
          }'

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Download deps
        working-directory: .
        run: go mod download

      - name: Test
        working-directory: .
        run: go test ./...

      - name: Prepare binary name
        id: names
        run: |
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            ext=".exe"
          fi
          echo "binary=manman-${{ matrix.os }}-${{ matrix.arch }}${ext}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.os }}-${{ matrix.arch }}
        working-directory: .
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -o "dist/${{ steps.names.outputs.binary }}" ./cmd/manman

      - name: Upload artifact ${{ matrix.os }}-${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.binary }}
          path: dist/${{ steps.names.outputs.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build, coverage]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect binaries
        run: |
          mkdir -p release
          find dist -maxdepth 2 -type f -exec mv {} release/ \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
